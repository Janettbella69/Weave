    # ── Weave（同一台机器上的另一个应用，由 Weave 仓库 deploy/tencent/nginx-add-weave.sh 加入）──
    # Weave 的网站只绑在宿主的 docker0 上（:4317），这里经 host.docker.internal 转发，和上面 codememory 的接法一样。
    # Weave 停着时只有这个站点返回 502，nginx 照常加载。证书是单独的一张（weave.azorashopping.site）。
    server {
        listen 80;
        server_name weave.azorashopping.site;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
    server {
        listen 443 ssl http2;
        server_name weave.azorashopping.site;
        ssl_certificate /etc/letsencrypt/live/weave.azorashopping.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weave.azorashopping.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        client_max_body_size 1m;
        # 请求体（比如微信看图交来的照片，最大就是上面的 1m）整个留在内存里，不写进这台共用 nginx 的临时文件。
        client_body_buffer_size 1m;
        # wrangler 自己的 /cdn-cgi/ 地址（本机数据浏览器、手动触发定时任务）不对外。
        location /cdn-cgi/ {
            return 404;
        }
        location / {
            proxy_pass http://host.docker.internal:4317;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 一轮 Agent 最长约 3 分钟。
            proxy_read_timeout 200s;
        }
    }
